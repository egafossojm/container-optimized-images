global
    log stdout format raw local0 info
    maxconn 1024
    # Already running as uid 99. A `user` / `group` line would try to setuid
    # and fail without CAP_SETUID.

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend http
    bind *:8080
    acl is_health path /health
    http-request return status 200 content-type text/plain string "ok" if is_health
    default_backend app

backend app
    # Replace with the real upstream. Health checks are off so a missing
    # backend does not mark the process unhealthy.
    # init-addr none: start even when "app" has no DNS record yet.
    server app app:8080 init-addr none
